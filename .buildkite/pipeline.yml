env:
  CI: "1"

steps:
  - label: ":unity: Direct managed contracts"
    command: |
      set -euo pipefail
      source scripts/bazel/ci-cache.sh
      export NUXIE_BAZEL_JOBS=2
      python3 scripts/bazel/update-nuget.py --check
      python3 scripts/bazel/sdk.py test
      python3 scripts/bazel/sdk.py build
    agents:
      queue: nuxie-pr
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 1
  - label: ":apple: Direct Unity native bridges"
    command: |
      set -euo pipefail
      source scripts/bazel/ci-cache.sh
      export NUXIE_BAZEL_JOBS=2
      python3 scripts/prepare-native.py
      python3 scripts/check-ios.py
      python3 scripts/pack.py
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 120
