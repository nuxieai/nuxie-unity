env:
  CI: "1"

steps:
  - label: ":unity: Managed and Apple bridge contracts"
    command: |
      set -euo pipefail
      if [[ -f dotnet/Nuxie.Unity.Core.Tests/Nuxie.Unity.Core.Tests.csproj ]]; then
        dotnet test dotnet/Nuxie.Unity.slnx --nologo
      else
        test -n "$(find dotnet/Nuxie.Unity.Core.Tests -name '*.cs' -print -quit)"
      fi
      swiftc -parse Runtime/Plugins/iOS/NuxieUnityBridge.swift
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 1
